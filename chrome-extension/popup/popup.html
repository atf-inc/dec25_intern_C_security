<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<body>
    <!-- Modern Header with Language Toggle -->
    <div class="header">
        <div class="header-left">
            <div class="logo">🛡️</div>
            <div class="title-section">
                <div class="title" data-i18n="popup_title">ATF CyberX</div>
                <div class="subtitle" data-i18n="popup_subtitle">Email Security</div>
            </div>
        </div>
        <div class="header-right">
            <!-- Modern Language Toggle Switch -->
            <div class="language-toggle">
                <input type="checkbox" id="language-switch" class="language-switch-input">
                <label for="language-switch" class="language-switch-label">
                    <span class="language-switch-inner">
                        <span class="language-switch-switch"></span>
                        <span class="language-text en">EN</span>
                        <span class="language-text ja">日本</span>
                    </span>
                </label>
            </div>
        </div>
    </div>
    
    <!-- Status Card -->
    <div class="status-card">
        <div class="status-indicator">
            <div class="status-dot active"></div>
            <span class="status-text" data-i18n="ui_protection_active">Protection Active</span>
        </div>
        <div class="quick-stats">
            <div class="quick-stat">
                <span class="stat-number" id="scanned-count">-</span>
                <span class="stat-label" data-i18n="ui_emails_scanned">Scanned</span>
            </div>
            <div class="quick-stat">
                <span class="stat-number threats" id="threats-count">-</span>
                <span class="stat-label" data-i18n="ui_threats_blocked">Threats</span>
            </div>
        </div>
    </div>
    
    <!-- Sensitivity Section -->
    <div class="section">
        <div class="section-header">
            <div class="section-title" data-i18n="ui_detection_mode">🎯 Detection Mode</div>
            <div class="section-subtitle" data-i18n="ui_choose_security_level">Choose your security level</div>
        </div>
        
        <div class="sensitivity-grid">
            <div class="sensitivity-card" data-level="conservative">
                <div class="sensitivity-icon">🎯</div>
                <div class="sensitivity-info">
                    <div class="sensitivity-name" data-i18n="popup_conservative">Conservative</div>
                    <div class="sensitivity-desc" data-i18n="popup_conservative_desc">Presentation safe</div>
                </div>
                <div class="sensitivity-radio-wrapper">
                    <input type="radio" name="sensitivity" value="conservative" class="sensitivity-radio">
                    <div class="radio-custom"></div>
                </div>
            </div>
            
            <div class="sensitivity-card selected" data-level="balanced">
                <div class="sensitivity-icon">⚖️</div>
                <div class="sensitivity-info">
                    <div class="sensitivity-name" data-i18n="popup_balanced">Balanced</div>
                    <div class="sensitivity-desc" data-i18n="popup_balanced_desc">Recommended</div>
                </div>
                <div class="sensitivity-radio-wrapper">
                    <input type="radio" name="sensitivity" value="balanced" class="sensitivity-radio" checked>
                    <div class="radio-custom"></div>
                </div>
            </div>
            
            <div class="sensitivity-card" data-level="aggressive">
                <div class="sensitivity-icon">🔍</div>
                <div class="sensitivity-info">
                    <div class="sensitivity-name" data-i18n="popup_aggressive">Aggressive</div>
                    <div class="sensitivity-desc" data-i18n="popup_aggressive_desc">Maximum security</div>
                </div>
                <div class="sensitivity-radio-wrapper">
                    <input type="radio" name="sensitivity" value="aggressive" class="sensitivity-radio">
                    <div class="radio-custom"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Advanced Stats -->
    <div class="stats-section">
        <div class="stats-header">
            <span class="stats-title" data-i18n="ui_todays_activity">📊 Today's Activity</span>
            <span class="stats-refresh" id="refresh-stats">↻</span>
        </div>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📧</div>
                <div class="stat-info">
                    <div class="stat-value" id="detailed-scanned">-</div>
                    <div class="stat-label" data-i18n="ui_emails_analyzed">Emails Analyzed</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🚫</div>
                <div class="stat-info">
                    <div class="stat-value" id="detailed-threats">-</div>
                    <div class="stat-label" data-i18n="ui_threats_blocked_full">Threats Blocked</div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Footer -->
    <div class="footer">
        <div class="footer-text" data-i18n="ui_real_time_protection">Real-time Gmail protection</div>
        <div class="version" data-i18n="popup_version">v2.1.0</div>
    </div>
    
    <script src="../i18n/translations.js"></script>
    <script src="popup.js"></script>
</body>
</html>
