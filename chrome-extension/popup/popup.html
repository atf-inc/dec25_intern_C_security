<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 320px;
            padding: 16px;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f9fafb;
        }
        
        .header {
            text-align: center;
            margin-bottom: 16px;
        }
        
        .logo {
            font-size: 24px;
            margin-bottom: 4px;
        }
        
        .title {
            font-size: 16px;
            font-weight: 600;
            color: #1f2937;
            margin: 0;
        }
        
        .subtitle {
            font-size: 12px;
            color: #6b7280;
            margin: 4px 0 0 0;
        }
        
        .stats {
            background: white;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #e5e7eb;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .stat-item:last-child {
            margin-bottom: 0;
        }
        
        .stat-label {
            font-size: 13px;
            color: #4b5563;
        }
        
        .stat-value {
            font-size: 13px;
            font-weight: 600;
            color: #1f2937;
        }
        
        .status {
            background: white;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #e5e7eb;
            text-align: center;
        }
        
        .status-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }
        
        .status-text {
            font-size: 13px;
            color: #4b5563;
            margin: 0;
        }
        
        .toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
        }
        
        .toggle-label {
            font-size: 13px;
            color: #4b5563;
        }
        
        .toggle-switch {
            width: 40px;
            height: 20px;
            background: #16a34a;
            border-radius: 10px;
            position: relative;
            cursor: pointer;
        }
        
        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            top: 2px;
            right: 2px;
            transition: all 0.2s ease;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🛡️</div>
        <h1 class="title">ATF CyberX</h1>
        <p class="subtitle">Email Security Assistant</p>
    </div>
    
    <div class="stats">
        <div class="stat-item">
            <span class="stat-label">Emails Scanned Today</span>
            <span class="stat-value" id="scanned-count">-</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Threats Blocked</span>
            <span class="stat-value" id="threats-count">-</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Last Scan</span>
            <span class="stat-value" id="last-scan">-</span>
        </div>
    </div>
    
    <div class="status">
        <div class="status-icon">✅</div>
        <p class="status-text">Protection Active</p>
        
        <div class="toggle">
            <span class="toggle-label">Auto-scan emails</span>
            <div class="toggle-switch" id="auto-scan-toggle"></div>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
